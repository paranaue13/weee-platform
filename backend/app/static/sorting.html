<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ταξινόμηση</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f7;color:#151515}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{min-height:58px;border:0;border-radius:14px;padding:12px;font-size:18px;font-weight:700;background:#202124;color:white}.btn.alt{background:#e9ecef;color:#111}.btn.warn{background:#9b1c1c}.tile{min-height:72px;text-align:left}.muted{color:#666;font-size:14px}.hidden{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}input,select{width:100%;min-height:52px;font-size:18px;border:1px solid #bbb;border-radius:12px;padding:10px}label{display:block;margin:8px 0 5px;font-weight:700}.count{font-size:34px;font-weight:800;min-width:46px;text-align:center}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#eee}.error{color:#9b1c1c;font-weight:700}.ok{color:#176b38;font-weight:700}.entry{border-top:1px solid #eee;padding:10px 0}.top{position:sticky;top:0;background:#f5f6f7;padding:8px 0;z-index:2}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:8px}.btn{font-size:17px}}
</style></head><body><div class="wrap">
<div id="login" class="card"><h1>Ταξινόμηση</h1><label>Χρήστης</label><input id="u" value="admin"><label>Κωδικός</label><input id="p" type="password" value="ChangeMe123!"><button id="loginBtn" class="btn" style="width:100%;margin-top:14px">ΕΙΣΟΔΟΣ</button><div id="loginErr" class="error"></div></div>
<div id="app" class="hidden"><div class="top"><div class="row space"><strong id="who"></strong><span id="net" class="pill">● online</span></div></div>
<div id="loadsCard" class="card"><div class="row space"><h2>Φορτία προς ταξινόμηση</h2><button id="reload" class="btn alt">↻</button></div><div id="loads"></div></div>
<div id="work" class="hidden"><div class="card"><button id="back" class="btn alt">← Φορτία</button><h2 id="loadTitle"></h2><div id="loadMeta" class="muted"></div></div>
<div class="card"><h3>Γρήγορα υλικά</h3><div id="quick" class="grid"></div><button id="allBtn" class="btn alt" style="width:100%;margin-top:12px">ΟΛΑ ΤΑ ΑΗΗΕ</button></div>
<div id="allCats" class="card hidden"><label>Αναζήτηση</label><input id="search" placeholder="Κωδικός ή περιγραφή"><div id="catList"></div></div>
<div class="card"><div class="row"><button id="newBag" class="btn alt">+ ΝΕΟΣ ΜΕΓΑΣΑΚΟΣ</button><button id="bulkBtn" class="btn alt">ΧΥΜΑ</button><button id="photoBtn" class="btn alt">📷 ΦΩΤΟ</button></div><input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment"><div id="mediaMsg" class="ok"></div></div>
<div id="entryCard" class="card hidden"><h3 id="entryCat"></h3><label>Μέσο συλλογής</label><select id="medium"></select><label>Κιλά αυτού του φορτίου</label><input id="weight" type="number" step="1" inputmode="decimal"><div class="row" style="margin-top:12px"><button id="saveEntry" class="btn">ΚΑΤΑΧΩΡΗΣΗ</button><button id="cancelEntry" class="btn alt">ΑΚΥΡΟ</button></div><div id="entryErr" class="error"></div></div>
<div id="bulk" class="card hidden"><h3>Χύμα</h3><div id="bulkRows"></div><button id="saveBulk" class="btn" style="width:100%;margin-top:12px">ΚΑΤΑΧΩΡΗΣΗ ΧΥΜΑ</button></div>
<div class="card"><div class="row space"><h3>Καταχωρήσεις</h3><strong id="sum"></strong></div><div id="entries"></div><button id="confirm" class="btn warn" style="width:100%;margin-top:14px">ΟΛΟΚΛΗΡΩΣΑ ΤΗΝ ΤΑΞΙΝΟΜΗΣΗ</button><div id="workMsg" class="ok"></div></div>
</div></div></div>
<script>
let token='', cats=[], media=[], current=null, selectedCat=null, bulkCounts={}; const $=x=>document.getElementById(x);
async function api(path,opt={}){const h={...(opt.headers||{}),...(token?{'Authorization':'Bearer '+token}:{})};if(opt.body && !(opt.body instanceof FormData))h['Content-Type']='application/json';const r=await fetch(path,{...opt,headers:h});let d;try{d=await r.json()}catch{d=null}if(!r.ok)throw new Error(Array.isArray(d?.detail)?d.detail.join(' · '):(d?.detail||'Σφάλμα'));return d}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('loginBtn').onclick=async()=>{try{let d=await api('/auth/token',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});token=d.access_token;let me=await api('/me');$('who').textContent=me.username;$('login').classList.add('hidden');$('app').classList.remove('hidden');cats=await api('/master/weee-categories');media=await api('/master/media');renderCats();renderMedium();await loadLoads()}catch(e){$('loginErr').textContent=e.message}}
async function loadLoads(){let rows=await api('/sorting/available');$('loads').innerHTML=rows.length?rows.map(x=>`<button class="btn tile" style="width:100%;margin:7px 0" data-id="${x.load_id}">${esc(x.receipt_type==='CONTAINER'?(x.container_number||x.receipt_number):x.receipt_type==='SMALL_POINTS'?(x.order_number||x.receipt_number):'ΚΑΡΟΤΣΑ ΚΟΥΡΤΙΝΑ')}<br><span style="font-size:14px;font-weight:500">${esc(x.supplier)} · ${new Date(x.receipt_date).toLocaleDateString('el-GR')} · ${Number(x.net_weight).toLocaleString('el-GR',{maximumFractionDigits:0})} kg</span></button>`).join(''):'<div class="muted">Δεν υπάρχουν φορτία διαθέσιμα.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openLoad(b.dataset.id,rows.find(x=>x.load_id===b.dataset.id)))}
$('reload').onclick=loadLoads;$('back').onclick=()=>{$('work').classList.add('hidden');$('loadsCard').classList.remove('hidden');loadLoads()}
async function openLoad(id,meta){current={id,meta};try{await api(`/sorting/${id}/start`,{method:'POST'})}catch(e){if(!e.message.includes('έτοιμο')){} }$('loadsCard').classList.add('hidden');$('work').classList.remove('hidden');$('loadTitle').textContent=meta.receipt_type==='CONTAINER'?(meta.container_number||meta.receipt_number):meta.receipt_type==='SMALL_POINTS'?(meta.order_number||meta.receipt_number):'ΚΑΡΟΤΣΑ ΚΟΥΡΤΙΝΑ';$('loadMeta').textContent=`${meta.supplier} · ${new Date(meta.receipt_date).toLocaleDateString('el-GR')} · Ζυγολόγιο ${Number(meta.net_weight).toLocaleString('el-GR',{maximumFractionDigits:0})} kg`;await refreshSession()}
function quickCats(){let wanted=['4Α2110','4Α1000','1Α1100','2Α1110','4Λ0000','4Ε0000','6Α0000','4Β0000'];return wanted.map(c=>cats.find(x=>x.code===c)).filter(Boolean)}
function renderCats(){let q=quickCats();$('quick').innerHTML=q.map(c=>`<button class="btn tile qcat" data-cat="${c.id}">${esc(c.description_el)}</button>`).join('');document.querySelectorAll('.qcat').forEach(b=>b.onclick=()=>chooseCat(b.dataset.cat));renderAll('')}
function renderAll(q){q=q.toLowerCase();let arr=cats.filter(c=>(c.code+' '+c.description_el).toLowerCase().includes(q)).slice(0,80);$('catList').innerHTML=arr.map(c=>`<button class="btn alt" style="width:100%;margin:5px 0;text-align:left" data-acat="${c.id}">${esc(c.code)} · ${esc(c.description_el)}</button>`).join('');document.querySelectorAll('[data-acat]').forEach(b=>b.onclick=()=>chooseCat(b.dataset.acat))}
$('allBtn').onclick=()=> $('allCats').classList.toggle('hidden');$('search').oninput=e=>renderAll(e.target.value)
function renderMedium(){ $('medium').innerHTML='<option value="">— χωρίς μέσο / χύμα —</option>'+media.map(m=>`<option value="${m.id}">${esc(m.code)}${m.tare_weight!=null?' · απόβαρο '+m.tare_weight+'kg':''}</option>`).join('') }
function chooseCat(id){selectedCat=cats.find(c=>c.id===id);$('entryCat').textContent=selectedCat.description_el;$('weight').value='';$('entryCard').classList.remove('hidden');$('entryCard').scrollIntoView({behavior:'smooth'})}
$('cancelEntry').onclick=()=> $('entryCard').classList.add('hidden');$('saveEntry').onclick=async()=>{try{let w=Number($('weight').value);if(!Number.isFinite(w)||w<0)throw new Error('Συμπλήρωσε κιλά');await api(`/sorting/${current.id}/entries`,{method:'POST',body:JSON.stringify({weee_category_id:selectedCat.id,collection_medium_id:$('medium').value||null,raw_weight:w,entry_type:'MEDIUM'})});$('entryCard').classList.add('hidden');await refreshSession()}catch(e){$('entryErr').textContent=e.message}}
$('newBag').onclick=async()=>{try{let types=await api('/master/medium-types');let t=types.find(x=>x.code==='BIG_BAG');let m=await api('/master/media',{method:'POST',body:JSON.stringify({type_id:t.id})});media.push(m);renderMedium();$('medium').value=m.id;$('mediaMsg').textContent='Νέος μεγασάκος: '+m.code}catch(e){$('mediaMsg').textContent=e.message}}
const bulkDefs=[['4Α2110','Πλυντήρια'],['4Α1000','Κουζίνες'],['INT-BULK-FRIDGE','Ψυγεία'],['INT-BULK-FREEZER','Καταψύκτες']];function renderBulk(){bulkCounts={};$('bulkRows').innerHTML=bulkDefs.map(([code,label])=>{let c=cats.find(x=>x.code===code);if(!c)return'';bulkCounts[c.id]=0;return `<div class="row space" style="margin:12px 0"><strong>${label}</strong><div class="row"><button class="btn alt minus" data-b="${c.id}">−</button><span class="count" id="bc-${c.id}">0</span><button class="btn alt plus" data-b="${c.id}">+</button></div></div>`}).join('');document.querySelectorAll('.plus').forEach(b=>b.onclick=()=>upd(b.dataset.b,1));document.querySelectorAll('.minus').forEach(b=>b.onclick=()=>upd(b.dataset.b,-1))}function upd(id,d){bulkCounts[id]=Math.max(0,(bulkCounts[id]||0)+d);$('bc-'+id).textContent=bulkCounts[id]}
$('bulkBtn').onclick=()=>{$('bulk').classList.toggle('hidden');renderBulk()};$('saveBulk').onclick=async()=>{try{for(const [id,n] of Object.entries(bulkCounts))if(n>0)await api(`/sorting/${current.id}/entries`,{method:'POST',body:JSON.stringify({weee_category_id:id,entry_type:'BULK',piece_count:n})});$('bulk').classList.add('hidden');await refreshSession()}catch(e){$('workMsg').textContent=e.message}}
$('photoBtn').onclick=()=>$('photoInput').click();$('photoInput').onchange=async e=>{if(!e.target.files[0])return;let f=new FormData();f.append('category','GENERAL');f.append('file',e.target.files[0]);try{await api(`/sorting/${current.id}/photos`,{method:'POST',body:f});$('mediaMsg').textContent='Η φωτογραφία αποθηκεύτηκε.'}catch(err){$('mediaMsg').textContent=err.message}}
async function refreshSession(){let s=await api(`/sorting/${current.id}`);$('sum').textContent=Number(s.sorting_weight).toLocaleString('el-GR')+' kg';$('entries').innerHTML=s.entries.map(e=>{let c=cats.find(x=>x.id===e.weee_category_id),m=media.find(x=>x.id===e.collection_medium_id);return `<div class="entry"><strong>${esc(c?.description_el||e.weee_category_id)}</strong><div class="muted">${m?esc(m.code)+' · ':''}${e.piece_count?e.piece_count+' τεμ. · ':''}${Number(e.raw_weight||0).toLocaleString('el-GR',{maximumFractionDigits:0})} kg</div></div>`}).join('')||'<div class="muted">Καμία καταχώρηση ακόμη.</div>';if(s.status!=='IN_PROGRESS'){$('confirm').disabled=true;$('confirm').textContent='ΕΧΕΙ ΥΠΟΒΛΗΘΕΙ ΣΤΟ LOGISTICS'}}
$('confirm').onclick=async()=>{if(!confirm('Επιβεβαιώνεις ότι ολοκλήρωσες την ταξινόμηση αυτού του φορτίου;'))return;try{await api(`/sorting/${current.id}/confirm`,{method:'POST'});$('workMsg').textContent='Η ταξινόμηση στάλθηκε στο Logistics για έλεγχο.';$('confirm').disabled=true}catch(e){$('workMsg').textContent=e.message}}
</script></body></html>
