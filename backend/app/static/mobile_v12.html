<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#17202a"><title>WEEE Sorting 2.0.1</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f6;color:#14191d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:8px}.card{background:#fff;border:1px solid #d7dde1;border-radius:15px;padding:14px;margin:9px 0}.top{position:sticky;top:0;background:#f3f5f6;z-index:3;padding:6px 0}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.space{justify-content:space-between}.btn{min-height:58px;border:0;border-radius:14px;padding:12px 14px;background:#18242f;color:#fff;font-size:17px;font-weight:800;touch-action:manipulation}.btn.alt{background:#e6ebee;color:#16212b}.btn.good{background:#17683a}.btn.warn{background:#8a5a00}.btn.danger{background:#9a2828}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:82px;text-align:left}.hidden{display:none!important}.muted{color:#66727b;font-size:13px}.pill{padding:5px 9px;border-radius:999px;background:#e8ecef;font-size:12px}.count{font-size:30px;font-weight:900;min-width:42px;text-align:center}input,select{width:100%;min-height:54px;border:1px solid #bcc7ce;border-radius:12px;padding:10px;font-size:18px;background:#fff}label{font-weight:800;display:block;margin:8px 0 5px}.entry{padding:12px 0;border-top:1px solid #edf0f2}.error{color:#9a2828;font-weight:700}.ok{color:#17683a;font-weight:700}.category{min-height:72px}.bulkline{border-top:1px solid #eee;padding:10px 0}.bulkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bulkcell{border:1px solid #e1e6e9;border-radius:12px;padding:9px}.loadPrimary{font-size:22px;font-weight:900;line-height:1.15}.loadSecondary{font-size:17px;font-weight:800;margin-top:5px}.closeX{float:right;min-height:42px;padding:7px 12px}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:2px solid #d7dde1;background:#fff;color:#18242f}.choice.on{border-color:#18242f;background:#eef2f4}.suggest{border:2px solid #17683a}.groupGap{height:24px;position:relative}.groupGap:after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:2px solid #c3ccd2}.mediumSep{grid-column:1/-1;height:20px;position:relative}.mediumSep:after{content:"";position:absolute;left:5%;right:5%;top:50%;border-top:1px solid #cbd4da}.tag{font-size:11px;background:#dff1e6;border-radius:999px;padding:3px 7px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="wrap">
<div id="login" class="card"><h1>Ταξινόμηση</h1><p class="muted">Android UI 2.5.29</p><label>Χρήστης</label><input id="u" value="admin"><label>Κωδικός</label><input id="p" type="password" value="ChangeMe123!"><button id="loginBtn" class="btn" style="width:100%;margin-top:12px">ΕΙΣΟΔΟΣ</button><div id="loginMsg" class="error"></div></div>
<div id="app" class="hidden"><div class="top"><div class="row space"><b id="who"></b><span id="net" class="pill">● ONLINE</span></div></div><div id="loads" class="card"><div class="row space"><h2>Φορτία</h2><button id="reload" class="btn alt">↻</button></div><div id="loadList"></div></div>
<div id="work" class="hidden"><div class="card"><button id="back" class="btn alt">← ΦΟΡΤΙΑ</button><h2 id="title"></h2><div id="meta" class="muted"></div></div>
<div class="card"><h3>Συχνά</h3><div id="quick" class="grid"></div><button id="allBtn" class="btn alt" style="width:100%;margin-top:10px">ΟΛΑ ΤΑ ΑΗΗΕ</button></div>
<div id="all" class="card hidden"><h3>Κατηγορίες ΑΗΗΕ</h3><div id="general" class="grid"></div><div id="categoryItems"></div><input id="search" placeholder="Αναζήτηση περιγραφής" style="margin-top:10px"></div>
<div class="card"><div class="grid"><button id="photoBtn" class="btn alt">📷 ΦΩΤΟ</button><button id="refreshMedia" class="btn alt">↻ ΜΕΣΑ</button></div><input id="photo" class="hidden" type="file" accept="image/*" capture="environment"><div id="mediumMsg" class="ok"></div></div>
<div id="entry" class="card hidden"><div class="panelHead"><h3 id="entryTitle"></h3><button id="closeEntry" class="btn alt closeX">×</button></div><div id="mediumTypeStep"><label>1 · Τύπος μέσου συλλογής</label><div id="mediumTypes" class="grid"></div></div><div id="mediumNumberStep" class="hidden"><label>2 · Αριθμός μέσου</label><input id="mediumSearch" autocomplete="off" placeholder="Γράψε αριθμό / κωδικό μέσου"><div id="suggestions"></div><div id="mediumNumbers" class="grid"></div><button id="createMedium" class="btn alt" style="width:100%;margin-top:10px">+ ΔΗΜΙΟΥΡΓΙΑ ΝΕΟΥ ΜΕΣΟΥ</button><div id="createMediumFields" class="hidden"><label>Απόβαρο (kg), αν απαιτείται</label><input id="newMediumTare" type="number" step="1" inputmode="decimal"><button id="confirmCreateMedium" class="btn good" style="width:100%;margin-top:8px">ΔΗΜΙΟΥΡΓΙΑ & ΕΠΙΛΟΓΗ</button></div></div><select id="medium" class="hidden"></select><div id="weighStep" class="hidden"><label>3 · Τρόπος ζύγισης</label><div class="two"><button id="modeScale" class="btn choice on">ΕΝΔΕΙΞΗ ΖΥΓΑΡΙΑΣ</button><button id="modeNet" class="btn choice">ΚΑΘΑΡΟ ΒΑΡΟΣ</button></div><label id="weightLabel">Τι γράφει η ζυγαριά;</label><input id="weight" type="number" step="1" inputmode="decimal"><div id="calcHint" class="muted"></div><div class="row" style="margin-top:10px"><button id="save" class="btn good" style="flex:1">ΑΠΟΘΗΚΕΥΣΗ</button><button id="cancel" class="btn alt">ΑΚΥΡΟ</button></div></div><div id="entryMsg" class="error"></div></div>
<div id="bulkWash" class="card hidden"><div class="panelHead"><h3>Χύμα Πλυντήρια / Κουζίνες</h3><button id="closeWash" class="btn alt closeX">×</button></div><div id="washRows"></div><div class="grid"><button class="btn good washAction" data-a="STORAGE">ΑΠΟΘΗΚΕΥΣΗ</button><button class="btn washAction" data-a="LOADING">ΦΟΡΤΩΣΗ</button><button class="btn warn washAction" data-a="TO_PRODUCTION">ΠΡΟΣ ΠΑΡΑΓΩΓΗ</button></div></div>
<div id="bulkFridge" class="card hidden"><div class="panelHead"><h3>Χύμα Ψυγεία</h3><button id="closeFridge" class="btn alt closeX">×</button></div><div id="fridgeRows"></div><div class="two"><button class="btn good fridgeAction" data-a="STORAGE">ΑΠΟΘΗΚΕΥΣΗ</button><button class="btn fridgeAction" data-a="LOADING">ΦΟΡΤΩΣΗ</button></div></div>
<div id="loadingPick" class="card hidden"><h3>Σε ποιο δελτίο φορτώνεται;</h3><div id="loadingList"></div><button id="cancelLoading" class="btn alt" style="width:100%">ΑΚΥΡΟ</button></div>
<div class="card"><div class="row space"><h3>Καταχωρήσεις</h3><b id="sum">0 kg</b></div><div class="muted">Νεότερη καταχώρηση πρώτη</div><div id="entries"></div><button id="confirm" class="btn danger" style="width:100%;margin-top:12px">ΟΛΟΚΛΗΡΩΣΑ ΤΗΝ ΤΑΞΙΝΟΜΗΣΗ</button><div id="workMsg" class="ok"></div></div></div></div></div>
<script>
let token='',cats=[],media=[],types=[],cur=null,cat=null,mode='SCALE_GROSS',editing=null,bulk={},pendingBulk=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function api(path,opt={}){let h={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&!(opt.body instanceof FormData))h['Content-Type']='application/json';let r=await fetch(path,{...opt,headers:h,cache:'no-store'});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||'Σφάλμα');return d}
$('loginBtn').onclick=async()=>{try{let d=await api('/auth/token',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});token=d.access_token;let m=await api('/me');$('who').textContent=m.username;$('login').classList.add('hidden');$('app').classList.remove('hidden');await reloadMasters();renderQuick();renderGeneral();await loadLoads()}catch(e){$('loginMsg').textContent=e.message}};
async function reloadMasters(){cats=await api('/master/weee-display');media=await api('/master/media');types=await api('/master/medium-types');renderMedium()}function dname(c){return c?.display_name||c?.official_description||c?.description_el||'Υλικό'}
async function loadLoads(){let rows=await api('/sorting/available');$('loadList').innerHTML=rows.map(x=>{let dt=new Date(x.receipt_date).toLocaleDateString('el-GR');let primary=x.receipt_type==='SMALL_POINTS'?`${dt}<br>ΕΝΤΟΛΗ ${esc(x.order_number||x.receipt_number)}`:`${dt}<br>${esc(x.supplier)}`;let second=x.receipt_type==='CONTAINER'?`ΚΑΔΟΣ / CTR ${esc(x.container_number||x.receipt_number)}`:x.receipt_type==='CURTAIN_TRAILER'?'ΚΟΥΡΤΙΝΑ':esc(x.receipt_number);return `<button class="btn tile" style="width:100%;margin:7px 0" data-id="${x.load_id}"><span class="loadPrimary">${primary}</span><br><span class="loadSecondary">${second}</span><br><span style="font-size:13px;font-weight:500">${Number(x.net_weight).toLocaleString('el-GR',{maximumFractionDigits:0})} kg · ${esc(x.carrier||'')}</span></button>`}).join('')||'<div class="muted">Δεν υπάρχουν διαθέσιμα φορτία.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openLoad(b.dataset.id,rows.find(x=>x.load_id===b.dataset.id)))}
$('reload').onclick=loadLoads;$('back').onclick=()=>{$('work').classList.add('hidden');$('loads').classList.remove('hidden');loadLoads()};async function openLoad(id,m){cur={id,m};try{await api('/sorting/'+id+'/start',{method:'POST'})}catch{}$('loads').classList.add('hidden');$('work').classList.remove('hidden');let dt=new Date(m.receipt_date).toLocaleDateString('el-GR');$('title').textContent=m.receipt_type==='SMALL_POINTS'?`ΕΝΤΟΛΗ ${m.order_number||m.receipt_number}`:m.receipt_type==='CONTAINER'?`ΚΑΔΟΣ / CTR ${m.container_number||m.receipt_number}`:'ΚΟΥΡΤΙΝΑ';$('meta').innerHTML=`<b>${dt}</b> · ${esc(m.supplier)} · ${Number(m.net_weight).toLocaleString('el-GR',{maximumFractionDigits:0})} kg`;closePanels();await refresh()}
function closePanels(except=''){['entry','bulkWash','bulkFridge','loadingPick','all'].forEach(id=>{if(id!==except)$(id)?.classList.add('hidden')})}
$('closeEntry').onclick=()=>closePanels();$('closeWash').onclick=()=>closePanels();$('closeFridge').onclick=()=>closePanels();
function quickCats(){let codes=['2Α1110','4Ε0000'];let out=codes.map(c=>cats.find(x=>x.code===c)).filter(Boolean);let p=cats.find(x=>x.code==='INT-6A-PRINT');if(p)out.push(p);return out}function renderQuick(){$('quick').innerHTML=`<button class="btn tile" id="qw">ΧΥΜΑ ΠΛΥΝΤΗΡΙΑ / ΚΟΥΖΙΝΕΣ</button><button class="btn tile" id="qf">ΧΥΜΑ ΨΥΓΕΙΑ</button>`+quickCats().map(c=>`<button class="btn tile q" data-c="${c.id}">${esc(dname(c))}</button>`).join('');$('qw').onclick=()=>openBulk('wash');$('qf').onclick=()=>openBulk('fridge');document.querySelectorAll('.q').forEach(b=>b.onclick=()=>choose(b.dataset.c))}
const generalNames={1:'1 · Εξοπλισμός ανταλλαγής θερμότητας',2:'2 · Οθόνες / monitors',3:'3 · Λαμπτήρες',4:'4 · Μεγάλος εξοπλισμός',5:'5 · Μικρός εξοπλισμός',6:'6 · Μικρός IT / τηλεπικοινωνιακός'};function renderGeneral(){$('general').innerHTML=Object.entries(generalNames).map(([n,t])=>`<button class="btn alt category" data-g="${n}">${t}</button>`).join('');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>renderCategory(b.dataset.g));$('categoryItems').innerHTML=''}function renderCategory(n){let a=cats.filter(c=>String(c.group_no)===String(n)&&c.active!==false);let parentsWithChildren=new Set(a.filter(c=>c.is_internal_subcategory).map(c=>c.official_code));a=a.filter(c=>c.is_internal_subcategory||!parentsWithChildren.has(c.code));let html='<h4>'+generalNames[n]+'</h4>';a.forEach(c=>{let code=c.official_code||c.code;if(n==='1'&&(code==='1Β1100'||code==='1Γ0000'))html+='<div class="groupGap"></div>';if(n==='2'&&(code==='2Α2110'||code==='2Β1000'))html+='<div class="groupGap"></div>';html+=`<button class="btn alt ac" style="width:100%;margin:5px 0;text-align:left" data-c="${c.id}">${esc(dname(c))}</button>`});$('categoryItems').innerHTML=html;document.querySelectorAll('.ac').forEach(b=>b.onclick=()=>choose(b.dataset.c))}$('allBtn').onclick=()=>{let opening=$('all').classList.contains('hidden');closePanels(opening?'all':'');$('all').classList.toggle('hidden',!opening);if(opening)renderGeneral()};$('search').oninput=e=>{let q=e.target.value.toLowerCase();if(!q)return renderGeneral();let a=cats.filter(c=>dname(c).toLowerCase().includes(q));$('categoryItems').innerHTML=a.map(c=>`<button class="btn alt ac" style="width:100%;margin:5px 0;text-align:left" data-c="${c.id}">${esc(dname(c))}</button>`).join('');document.querySelectorAll('.ac').forEach(b=>b.onclick=()=>choose(b.dataset.c))};
function mediumName(m){let t=types.find(x=>x.id===m.type_id);let code=String(m.code||'').replace(/^I2-/,'');return (t?.name_el||'Μέσο')+' · '+code+(m.tare_weight!=null?' · απόβαρο '+m.tare_weight+' kg':'')}function renderMedium(){$('medium').innerHTML='<option value="">— επίλεξε μέσο —</option>'+media.map(m=>`<option value="${m.id}">${esc(mediumName(m))}</option>`).join('')}
async function choose(id){cat=cats.find(c=>c.id===id);editing=null;closePanels('entry');$('entryTitle').textContent=dname(cat);$('weight').value='';$('medium').value='';$('mediumNumberStep').classList.add('hidden');$('weighStep').classList.add('hidden');$('entry').classList.remove('hidden');await renderMediumTypes();$('entry').scrollIntoView({behavior:'smooth'})}
async function renderMediumTypes(){let ranked=await api(`/sorting/${cur.id}/medium-type-suggestions?weee_category_id=${encodeURIComponent(cat.id)}`);let group=t=>['BASKET_SMALL','BASKET_LARGE','INFOCYCLE_1','INFOCYCLE_2'].includes(t.code)?0:['SACK_1KG','SACK_2KG_UN'].includes(t.code)?1:['PALLET','BOX','BULK'].includes(t.code)?2:3;ranked=ranked.filter(t=>!['METAL_BASKET','BIG_BAG'].includes(t.code)).sort((a,b)=>group(a)-group(b)||(b.usage_count-a.usage_count)||a.name_el.localeCompare(b.name_el,'el'));let last=-1,html='';ranked.forEach((t,i)=>{let g=group(t);if(last>=0&&g!==last)html+='<div class="mediumSep"></div>';html+=`<button class="btn ${t.usage_count>0?'suggest':'alt'}" data-mt="${t.id}">${esc(t.name_el)}${t.usage_count>0?`<br><span class="muted">χρησιμοποιήθηκε ${t.usage_count}×</span>`:''}</button>`;last=g});$('mediumTypes').innerHTML=html;document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>chooseMediumType(b.dataset.mt))}
let chosenMediumType=null,mediumRowsCache=[],mediumOrder=new Map();
function paintMediumNumbers(){let q=$('mediumSearch').value.trim().toLowerCase();let rows=mediumRowsCache.filter(m=>!q||String(m.code).toLowerCase().includes(q));$('mediumNumbers').innerHTML=rows.slice(0,30).map(m=>`<button class="btn ${mediumOrder.has(m.id)&&mediumOrder.get(m.id)===0?'suggest':'alt'}" data-mid="${m.id}">${esc(String(m.code).replace(/^I2-/,''))}<br><span class="muted">${m.tare_weight!=null?'Απόβαρο '+m.tare_weight+' kg':''}</span></button>`).join('')||'<div class="muted">Δεν βρέθηκε καταχωρημένο μέσο. Μπορείς να το δημιουργήσεις εδώ.</div>';document.querySelectorAll('[data-mid]').forEach(b=>b.onclick=()=>chooseMedium(b.dataset.mid))}
async function chooseMediumType(typeId){chosenMediumType=typeId;$('mediumNumberStep').classList.remove('hidden');$('weighStep').classList.add('hidden');$('createMediumFields').classList.add('hidden');$('mediumSearch').value='';mediumRowsCache=media.filter(m=>m.type_id===typeId&&m.active!==false);let sugg=await api(`/sorting/${cur.id}/medium-suggestions?weee_category_id=${encodeURIComponent(cat.id)}`);mediumOrder=new Map(sugg.map((m,i)=>[m.id,i]));mediumRowsCache.sort((a,b)=>(mediumOrder.get(a.id)??9999)-(mediumOrder.get(b.id)??9999)||String(a.code).localeCompare(String(b.code),'el',{numeric:true}));$('suggestions').innerHTML=sugg.some(x=>x.type_id===typeId)?'<div class="muted">Πρώτα εμφανίζονται τα πιθανότερα μέσα για αυτό το υλικό.</div>':'';paintMediumNumbers();$('mediumNumberStep').scrollIntoView({behavior:'smooth'})}
$('mediumSearch').oninput=paintMediumNumbers;$('createMedium').onclick=()=>{$('createMediumFields').classList.toggle('hidden');$('newMediumTare').value=''};$('confirmCreateMedium').onclick=async()=>{try{let code=$('mediumSearch').value.trim();if(!code)throw new Error('Γράψε πρώτα αριθμό / κωδικό μέσου');let tare=$('newMediumTare').value?Number($('newMediumTare').value):null;let m=await api(`/sorting/${cur.id}/media`,{method:'POST',body:JSON.stringify({type_id:chosenMediumType,code,tare_weight:tare,linked_loading_order_id:null})});await reloadMasters();chooseMedium(m.id)}catch(e){$('entryMsg').textContent=e.message}}
function chooseMedium(id){$('medium').value=id;$('weighStep').classList.remove('hidden');updateHint();$('weighStep').scrollIntoView({behavior:'smooth'})}
function setMode(x){mode=x;$('modeScale').classList.toggle('on',x==='SCALE_GROSS');$('modeNet').classList.toggle('on',x==='MEDIUM');$('weightLabel').textContent=x==='SCALE_GROSS'?'Τι γράφει η ζυγαριά;':'Καθαρό βάρος υλικού';updateHint()}$('modeScale').onclick=()=>setMode('SCALE_GROSS');$('modeNet').onclick=()=>setMode('MEDIUM');$('medium').onchange=updateHint;function updateHint(){let m=media.find(x=>x.id===$('medium').value);$('calcHint').textContent=mode==='SCALE_GROSS'?(m?.tare_weight!=null?`Το πρόγραμμα θα αφαιρέσει αυτόματα απόβαρο ${m.tare_weight} kg και το ήδη καταχωρημένο περιεχόμενο.`:'Το επιλεγμένο μέσο χρειάζεται απόβαρο στο Μητρώο.'):'Θα καταχωρηθεί απευθείας το καθαρό βάρος που δίνεις.'}
$('cancel').onclick=()=>{$('entry').classList.add('hidden');editing=null};$('save').onclick=async()=>{try{let w=Number($('weight').value);if(!Number.isFinite(w)||w<=0)throw new Error('Συμπλήρωσε βάρος');let body={weee_category_id:cat.id,collection_medium_id:$('medium').value||null,entry_type:editing?'MEDIUM':mode,raw_weight:w};if(!body.collection_medium_id)throw new Error('Επίλεξε μέσο συλλογής');await api(editing?'/sorting/entries/'+editing:'/sorting/'+cur.id+'/entries',{method:editing?'PUT':'POST',body:JSON.stringify(body)});$('entry').classList.add('hidden');editing=null;await refresh();window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('entryMsg').textContent=e.message}};
const washDefs={pairs:[[['4Α2110','Με μοτέρ'],['4Α2120','Χωρίς μοτέρ'],'Πλυντήρια οικιακού τύπου']],single:[['4Α2200','Πλυντήρια επαγγελματικού τύπου'],['4Α1000','Κουζίνες']]};const fridgeDefs={pairs:[[['1Α1100','Με μοτέρ'],['1Α1200','Χωρίς μοτέρ'],'Ψυγεία / Καταψύκτες οικιακού τύπου'],[['1Α2100','Με μοτέρ'],['1Α2200','Χωρίς μοτέρ'],'Μη οικιακού τύπου']],single:[['1Α3000','Ψυγεία αμμωνίας']]};
function counter(c,label){if(!c)return'';bulk[c.id]=0;return `<div class="bulkcell"><b>${label}</b><div class="row"><button class="btn alt" data-minus="${c.id}">−</button><span class="count" id="bc-${c.id}">0</span><button class="btn alt" data-plus="${c.id}">+</button></div></div>`}
function openBulk(kind){bulk={};closePanels(kind==='wash'?'bulkWash':'bulkFridge');let defs=kind==='wash'?washDefs:fridgeDefs,target=kind==='wash'?'washRows':'fridgeRows';$(kind==='wash'?'bulkWash':'bulkFridge').classList.remove('hidden');let html='';for(let [a,b,title] of defs.pairs){let ca=cats.find(x=>x.official_code===a[0]&&!x.is_internal_subcategory)||cats.find(x=>x.code===a[0]);let cb=cats.find(x=>x.official_code===b[0]&&!x.is_internal_subcategory)||cats.find(x=>x.code===b[0]);html+=`<div class="bulkline"><b>${title}</b><div class="bulkgrid">${counter(ca,a[1])}${counter(cb,b[1])}</div></div>`}for(let [code,label] of defs.single){let c=cats.find(x=>x.official_code===code&&!x.is_internal_subcategory)||cats.find(x=>x.code===code);html+=`<div class="bulkline">${counter(c,label)}</div>`}$(target).innerHTML=html;document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>upd(b.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>upd(b.dataset.minus,-1))}function upd(id,d){bulk[id]=Math.max(0,(bulk[id]||0)+d);$('bc-'+id).textContent=bulk[id]}
async function bulkAction(kind,action){if(!Object.values(bulk).some(x=>x>0))return $('workMsg').textContent='Δεν έχεις επιλέξει τεμάχια.';pendingBulk={kind,action,counts:{...bulk}};if(action==='LOADING'){let orders=(await api('/loading/orders')).filter(x=>x.status==='OPEN');$('loadingPick').classList.remove('hidden');$('loadingList').innerHTML=orders.map(o=>`<button class="btn alt" style="width:100%;margin:5px 0" data-lo="${o.id}">${esc(o.loading_number)} · ${Number(o.loaded_weight).toLocaleString('el-GR')} / ${Number(o.max_allowed_weight).toLocaleString('el-GR',{maximumFractionDigits:0})} kg</button>`).join('')||'<div class="error">Δεν υπάρχουν ανοιχτά δελτία φόρτωσης.</div>';document.querySelectorAll('[data-lo]').forEach(b=>b.onclick=()=>commitBulk(b.dataset.lo));return}await commitBulk(null)}document.querySelectorAll('.washAction').forEach(b=>b.onclick=()=>bulkAction('wash',b.dataset.a));document.querySelectorAll('.fridgeAction').forEach(b=>b.onclick=()=>bulkAction('fridge',b.dataset.a));$('cancelLoading').onclick=()=>$('loadingPick').classList.add('hidden');async function commitBulk(orderId){try{for(let [id,n] of Object.entries(pendingBulk.counts))if(n>0)await api('/sorting/'+cur.id+'/entries',{method:'POST',body:JSON.stringify({weee_category_id:id,entry_type:'BULK',piece_count:n,notes:`FLOW=${pendingBulk.action}${orderId?';LOADING_ORDER='+orderId:''}`})});$('bulkWash').classList.add('hidden');$('bulkFridge').classList.add('hidden');$('loadingPick').classList.add('hidden');$('workMsg').textContent=pendingBulk.action==='TO_PRODUCTION'?'Καταχωρήθηκε προς παραγωγή.':pendingBulk.action==='LOADING'?'Καταχωρήθηκε για το επιλεγμένο δελτίο φόρτωσης.':'Καταχωρήθηκε για αποθήκευση.';pendingBulk=null;await refresh();window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('workMsg').textContent=e.message}}
$('photoBtn').onclick=()=>$('photo').click();$('photo').onchange=async e=>{if(!e.target.files[0])return;let f=new FormData();f.append('category','GENERAL');f.append('file',e.target.files[0]);try{await api('/sorting/'+cur.id+'/photos',{method:'POST',body:f});$('mediumMsg').textContent='Η φωτογραφία αποθηκεύτηκε.'}catch(err){$('mediumMsg').textContent=err.message}};$('refreshMedia').onclick=reloadMasters;
async function refresh(){let s=await api('/sorting/'+cur.id);$('sum').textContent=Number(s.sorting_weight).toLocaleString('el-GR')+' kg';$('entries').innerHTML=s.entries.map(e=>{let c=cats.find(x=>x.id===e.weee_category_id),m=media.find(x=>x.id===e.collection_medium_id);return `<div class="entry"><b>${esc(dname(c))}</b><div class="muted">${m?esc(mediumName(m))+' · ':''}${e.piece_count?e.piece_count+' τεμ. · ':''}${Number(e.raw_weight||0).toLocaleString('el-GR',{maximumFractionDigits:0})} kg</div>${s.status==='IN_PROGRESS'?`<div class="row" style="margin-top:7px"><button class="btn alt" data-edit="${e.id}">EDIT</button><button class="btn danger" data-del="${e.id}">ΔΙΑΓΡΑΦΗ</button></div>`:''}</div>`}).join('')||'<div class="muted">Καμία καταχώρηση.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Διαγραφή αυτής της καταχώρησης;')){await api('/sorting/entries/'+b.dataset.del,{method:'DELETE'});await refresh()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEntry(b.dataset.edit,s.entries));if(s.status!=='IN_PROGRESS'){$('confirm').disabled=true;$('confirm').textContent='ΕΧΕΙ ΥΠΟΒΛΗΘΕΙ'}}function editEntry(id,entries){let e=entries.find(x=>x.id===id);cat=cats.find(x=>x.id===e.weee_category_id);editing=id;$('entryTitle').textContent='Edit · '+dname(cat);$('medium').value=e.collection_medium_id||'';$('weight').value=e.raw_weight||'';setMode('MEDIUM');$('suggestions').innerHTML='';$('entry').classList.remove('hidden');$('entry').scrollIntoView({behavior:'smooth'})}
$('confirm').onclick=async()=>{if(!confirm('Επιβεβαιώνεις ότι ολοκλήρωσες την ταξινόμηση;'))return;try{await api('/sorting/'+cur.id+'/confirm',{method:'POST'});closePanels();$('work').classList.add('hidden');$('loads').classList.remove('hidden');cur=null;await loadLoads();window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('workMsg').textContent=e.message}}
</script></body></html>
