services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: weee
      POSTGRES_USER: weee
      POSTGRES_PASSWORD: weee
    volumes:
      - weee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weee -d weee"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  weee_pgdata:
